[build]
  # Publica o Web App diretamente a partir da raiz (index.html)
  # Isso evita erros de compilação, vulnerabilidades de servidor e custos de serverless.
  command = ""
  publish = "."

[build.environment]
  # Desativa o plugin @netlify/plugin-nextjs para publicar como site estático ultra-rápido
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
